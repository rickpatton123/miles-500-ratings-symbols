name: Generate combined rating PNGs
on:
  push:
    paths:
      - '.github/workflows/generate-pairs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 25 transparent paired dots
        run: |
          python3 - <<'PY'
          import os,struct,zlib
          os.makedirs('symbols/pairs',exist_ok=True)
          colors={'black':(17,17,17),'green':(16,168,74),'yellow':(244,209,43),'red':(229,43,49)}
          names=(*colors,'green-yellow')
          def chunk(tag,data):
              return struct.pack('!I',len(data))+tag+data+struct.pack('!I',zlib.crc32(tag+data)&0xffffffff)
          for left in names:
            for right in names:
              rows=[]
              for y in range(96):
                row=bytearray([0])
                for x in range(200):
                  cx=47.5 if x<100 else 151.5
                  inside=(x-cx)**2+(y-47.5)**2<=43**2
                  name=left if x<100 else right
                  color=colors['green' if x<cx else 'yellow'] if name=='green-yellow' else colors[name]
                  row.extend((*color,255 if inside else 0))
                rows.append(bytes(row))
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',200,96,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
              with open('symbols/pairs/'+left+'-'+right+'.png','wb') as f:f.write(png)
          PY
      - name: Commit paired symbols
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols/pairs/*.png
          git diff --cached --quiet || (git commit -m "Generate paired rating dots" && git push)
